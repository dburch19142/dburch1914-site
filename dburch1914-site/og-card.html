<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex">
<title>Link preview card</title>
<!-- Source for og-card.png, the image shown when the site is shared. Rebuild: node build-resume.js -->
<style>
  body{margin:0;width:1200px;height:630px;background:#FAF8F3;color:#1C2431;font-family:'Segoe UI',Helvetica,Arial,sans-serif;display:flex;align-items:center;gap:64px;padding:0 80px;box-sizing:border-box;border-bottom:14px solid #B5652E;}
  img{width:300px;height:400px;object-fit:cover;object-position:center 25%;border-radius:8px;border:1px solid #DED6C6;flex-shrink:0;}
  .eyebrow{font-weight:600;font-size:22px;letter-spacing:.14em;text-transform:uppercase;color:#7A431C;}
  h1{font-family:Georgia,'Times New Roman',serif;font-size:84px;line-height:1.05;margin:18px 0 22px;}
  p{font-size:31px;line-height:1.4;margin:0;max-width:20em;}
  .url{margin-top:30px;font-size:24px;color:#646E7A;}
</style>
</head>
<body>
  <img src="portrait.jpg" alt="">
  <div>
    <div class="eyebrow">QA Leadership &middot; Test Automation</div>
    <h1>Darrell Burch</h1>
    <p>Built QA organizations from the ground up at four companies.</p>
    <div class="url">dburch1914.com</div>
  </div>
</body>
</html>
